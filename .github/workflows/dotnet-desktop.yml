name: .NET Desktop CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore UPM.sln

    - name: Build solution (${{ matrix.configuration }})
      run: dotnet build UPM.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish single-file executable (Release)
      if: matrix.configuration == 'Release'
      run: dotnet publish Apps/UPM.Desktop/UPM.Desktop.csproj -p:PublishProfile=SingleFile-win-x64

    - name: Upload published artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: UPM-Desktop-win-x64
        path: Apps/UPM.Desktop/bin/publish/win-x64/
